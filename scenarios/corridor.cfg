# Shared defaults for the navigation and combat corridor stages.
# Paths are relative to this configuration file.
doom_scenario_path = generated/corridor-v1.wad
doom_map = map01
mode = PLAYER
doom_skill = 3

screen_resolution = RES_160X120
screen_format = GRAY8
window_visible = false
render_hud = false
render_crosshair = true
objects_info_enabled = false

episode_start_time = 14
episode_timeout = 1400
# Task rewards and training-only shaping are calculated by CorridorEnvironment.
living_reward = 0
death_penalty = 0

# Order must match the policy action vectors in src/corridor_env.py.
available_buttons =
{
    MOVE_FORWARD
    MOVE_LEFT
    MOVE_RIGHT
    TURN_LEFT
    TURN_RIGHT
    ATTACK
}

available_game_variables =
{
    POSITION_X
    POSITION_Y
    ANGLE
    HEALTH
    AMMO2
    KILLCOUNT
}
