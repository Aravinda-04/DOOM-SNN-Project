# ViZDoom configuration for FreeDoom2 MAP01 (full level).
# Requires freedoom2.wad to be placed in the project root.
# Download from: https://freedoom.github.io/download.html

doom_scenario_path = ../freedoom2.wad

# Episode timing: 35 tics/sec * 60 sec/min * 10 min = 21000
episode_timeout = 21000

# Available buttons used by the discrete action catalogue
available_buttons = {MOVE_FORWARD MOVE_BACKWARD MOVE_LEFT MOVE_RIGHT TURN_LEFT TURN_RIGHT ATTACK USE}

# Game variables available to the agent
available_game_variables = {HEALTH ARMOR AMMO2 AMMO3 KILLCOUNT ITEMCOUNT SECRETCOUNT POSITION_X POSITION_Y ANGLE}

# Object labels for novelty and reward shaping
labels_buffer_enabled = true
sectors_info_enabled = true
objects_info_enabled = true

# Vision settings (matches existing project conventions)
screen_resolution = RES_160X120
screen_format = GRAY8
render_hud = true
render_crosshair = false
render_weapon = true
render_decals = false
render_particles = false
render_effects_sprites = false

# Game mode
mode = PLAYER

# Don't end episode on player death - let Python handle it
living_reward = 0
death_penalty = 0
doom_skill = 3
